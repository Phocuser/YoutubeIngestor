name: YouTube Ingestor release

on:
  push:
    branches: [release]
  pull_request:
    branches: [release]

permissions:
  contents: read
  packages: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the pinned Mycelium source tree
        uses: actions/checkout@v4
        with:
          repository: Phocuser/mycelium
          ref: 0a0ed4c06bd9c33fd1cde4c815d0c5a439dd1ea8
          path: mycelium-source
      - name: Prepare clean pinned Mycelium build context
        run: |
          mkdir mycelium-context
          git -C mycelium-source archive 0a0ed4c06bd9c33fd1cde4c815d0c5a439dd1ea8 | tar -x -C mycelium-context
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline tests
        run: python -m pytest -q
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image and publish on release pushes
        uses: docker/build-push-action@v6
        with:
          context: .
          build-contexts: mycelium-source=./mycelium-context
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/phocuser/youtubeingestor:${{ github.sha }}
          build-args: VCS_REF=${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/Phocuser/YoutubeIngestor
